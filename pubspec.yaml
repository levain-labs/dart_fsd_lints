name: feature_sliced_lints
description: >-
  Analyzer plugin that enforces Feature-Sliced Design (layers, slices, public
  APIs and a pure domain) in Dart and Flutter projects.
version: 0.2.0
repository: https://github.com/levain-labs/dart_fsd_lints
issue_tracker: https://github.com/levain-labs/dart_fsd_lints/issues
topics:
  - lints
  - analyzer
  - architecture

# Note: the analyzer re-resolves these dependencies in its own synthetic
# package, so pubspec.lock here only matters for running the tests. The
# analyzer moves in lockstep with the SDK; after upgrading Dart/Flutter, check
# that `dart test` still passes.
environment:
  sdk: ^3.12.2

dependencies:
  # Within the range required by the Dart 3.12 analysis server (^0.3.8).
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0
  # Reads feature_sliced_lints.yaml. Already a dependency of analyzer.
  yaml: ^3.1.0

dev_dependencies:
  analyzer_testing: ^0.4.2
  lints: ^6.1.0
  test: ^1.32.0
  test_reflective_loader: ^0.4.0
